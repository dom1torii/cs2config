// Toggles volume
alias "tvol" "toggle volume 0 0.251534"

// Uncomment line below and change "key" to toggle volume with a key 
// bind "key" "tvol"

// custom sounds volume
snd_toolvolume "0.1"

// audio
volume "0.251534"
snd_menumap_volume "0"
snd_headphone_eq "0"
snd_spatialize_lerp "0"
snd_steamaudio_enable_perspective_correction "1"
snd_mute_losefocus "0"

// voice 
snd_voipvolume "1"
voice_modenable "1"
voice_vox "0"
voice_loopback "0"
voice_always_sample_mic "0"
voice_threshold "-120"

exec modules/audio/music
