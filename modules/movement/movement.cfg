bind space "+jump"
bind mwheeldown "+jump"

// these 2 binds are overridden by jumpbug, comment it out to use these.
bind mwheelup "+jump"
bind ctrl "+duck"

// Jumpbug binds
// Manual crouch, doesnt need a reset bind 
// comment out to stop using
exec modules/movement/jb_manual

// Auto crouch, use alt to reset before every jump
// personally, to me it feels less consistent than manual 
// uncomment to use
// exec modules/movement/jb_auto

// Simple jb bind, requires manual crouch, can't be on a scroll wheel
// worst of them all bus is very simple 
// exec modules/movement/jb_simple

// Longjump binds
// Requires reset, scroll down to use, press reset button (X) before jumping
// exec modules/movement/lj_reset

// Simple, requires no reset but can't be binded to a mwheel
// exec modules/movement/lj_simple

bind shift "+sprint"
bind w "+forward"
bind a "+left"
bind s "+back"
bind d "+right"

option_duck_method "false"
option_speed_method "false"
